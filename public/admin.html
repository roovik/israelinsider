<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Israel Insider Admin</title>
<style>
:root{--ink:#14213d;--paper:#faf7ee;--line:#d9d2bd;--gold:#d8a31a}
body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--paper);color:var(--ink)}
.w{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:0 0 10px}h2{font-size:18px;margin:22px 0 8px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
button,.b{font:600 15px system-ui;min-height:40px;padding:0 14px;border-radius:4px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
button.p{background:var(--gold);border-color:var(--gold)}button.on{background:var(--ink);color:#fff}button.d{border-color:#a33;color:#a33}
input,select,textarea{font:15px system-ui;padding:9px;border:1px solid #9aa5bd;border-radius:4px;width:100%;box-sizing:border-box;background:#fff;color:var(--ink)}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 3px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:10px}.row>*{flex:1 1 220px}
.sm{font-size:13px;color:#46536c}.msg{padding:10px;border-radius:4px;margin:10px 0}.ok{background:#e4f4ea}.er{background:#fde8e8}
.tag{display:inline-block;border:1px solid var(--ink);border-radius:12px;padding:0 8px;font-size:12px;margin-right:4px}
pre{white-space:pre-wrap;word-break:break-word;margin:4px 0}
</style></head><body><div class="w">
<h1>Israel Insider admin</h1>
<div id="login" class="card"><label for="k">Admin key</label><input id="k" type="password" autocomplete="off"><p><button class="p" id="go">Sign in</button></p><p class="sm">The key stays in this browser tab only.</p></div>
<div id="app" hidden>
<nav id="nav"><button data-t="subs" class="on">Submissions</button><button data-t="voices">Voices</button><button data-t="feeds">Feeds</button><button data-t="items">Items</button><button data-t="entries">Entries</button><button data-t="proposals">Proposals</button><button data-t="messages">Messages</button><button data-t="taxonomy">Taxonomy</button><button data-t="subscribers">Subscribers</button><button id="imp" type="button">Import voices batch 1</button><button id="res" type="button">Resolve feeds</button><button class="p" id="ing">Run ingestion now</button><button id="out">Sign out</button></nav>
<div id="msg"></div><div id="pane"></div></div>
<script>
(function(){
var key=sessionStorage.getItem('ak')||'',$=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function api(p,body){return fetch('/api/admin/'+p,{method:body?'POST':'GET',headers:{authorization:'Bearer '+key,'content-type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){if(r.status===401)throw new Error('Wrong key');if(!r.ok)throw new Error('Error '+r.status);return r.json()})}
function say(t,ok){$('#msg').innerHTML='<div class="msg '+(ok?'ok':'er')+'">'+esc(t)+'</div>'}
var tab='subs',prefill=null;
function show(){$('#app').hidden=!key;$('#login').hidden=!!key}
$('#go').onclick=function(){key=$('#k').value.trim();sessionStorage.setItem('ak',key);api('voices').then(function(){show();load()}).catch(function(e){key='';sessionStorage.removeItem('ak');show();$('#login').insertAdjacentHTML('beforeend','<div class="msg er">'+esc(e.message)+'</div>')})};
$('#out').onclick=function(){key='';sessionStorage.removeItem('ak');location.reload()};
$('#nav').onclick=function(e){var t=e.target.dataset.t;if(!t)return;tab=t;document.querySelectorAll('#nav [data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});load()};
$('#imp').onclick=function(){say('Importing...',true);fetch('/seed/batch1.json').then(function(r){return r.json()}).then(function(b){return api('import',b)}).then(function(r){load();say('Imported '+r.voices_added+' new voices (pending) and '+r.feeds_added+' channels.',true)}).catch(function(e){say(e.message)})};
$('#res').onclick=function(){say('Resolving feed addresses, this can take a minute...',true);api('resolve',{}).then(function(r){load();say('Found '+r.found+' feeds. Not found: '+r.missed.length+(r.missed.length?' ('+r.missed.slice(0,8).join(', ')+(r.missed.length>8?', ...':'')+')':'')+'.',true)}).catch(function(e){say(e.message)})};
$('#ing').onclick=function(){say('Running ingestion...',true);api('ingest',{}).then(function(r){load();setTimeout(function(){say('Done. Added '+r.added+' new items. Total '+r.total+'.',true)},300)}).catch(function(e){say(e.message)})};
function load(){$('#msg').innerHTML='';({subs:subs,voices:voices,feeds:feeds,items:items,subscribers:subscribers,entries:entries,proposals:proposals,messages:messages,taxonomy:taxonomy})[tab]().catch(function(e){say(e.message)})}
function subs(){return api('submissions').then(function(r){var l=r.submissions.slice().reverse();$('#pane').innerHTML=l.length?l.map(function(s){return '<div class="card"><b>'+esc(s.name)+'</b> <span class="sm">'+esc(s.email)+' · '+esc(s.at.slice(0,10))+'</span><pre>'+esc(s.bio)+'</pre><div class="sm">Site: '+esc(s.website)+'<br>Feeds: '+esc(s.feeds)+'<br>Social: '+esc(s.social)+' · Formats: '+esc(s.formats)+' · Topics: '+esc(s.topics)+' · Full text OK: '+(s.consent_full_text?'yes':'no')+'</div><p><button data-use="'+esc(s.id)+'">Create voice from this</button> <button class="d" data-sdel="'+esc(s.id)+'">Delete</button></p></div>'}).join(''):'<p class="sm">No submissions yet.</p>';$('#pane').onclick=function(e){var u=e.target.dataset.use,d=e.target.dataset.sdel;if(u){var s=l.find(function(x){return x.id===u});prefill={name:s.name,short_bio:s.bio,website:s.website,topics:s.topics,full:s.consent_full_text};tab='voices';document.querySelectorAll('#nav [data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t==='voices')});load()}if(d)api('submission/delete',{id:d}).then(load)}})}
function voiceForm(v){v=v||{};var c=v.consent||{};return '<form id="vf" class="card"><div class="row"><div><label for="vn">Name</label><input id="vn" value="'+esc(v.name)+'" required></div><div><label for="vs">Status</label><select id="vs">'+['pending','listed','paused','removed'].map(function(s){return '<option'+((v.status||'pending')===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div></div><label for="vb">Short bio</label><textarea id="vb" rows="2">'+esc(v.short_bio)+'</textarea><div class="row"><div><label for="vw">Website</label><input id="vw" value="'+esc(v.website)+'"></div><div><label for="vt">Topics (comma separated)</label><input id="vt" value="'+esc(Array.isArray(v.topics)?v.topics.join(', '):v.topics)+'"></div></div><div class="row"><div><label for="vp">Position tag (optional)</label><input id="vp" value="'+esc(v.position_tag)+'"></div><div><label for="vc">Consent note</label><input id="vc" value="'+esc(c.note)+'"></div></div><label><input type="checkbox" id="vf2" style="width:auto"'+((c.full_text_ok||v.full)?' checked':'')+'> Creator gave written permission for full text</label><p><button class="p" type="submit">Save voice</button></p></form>'}
var vfilter='all';
function vmatch(v,f,fs){var vf=fs.filter(function(x){return x.voice_id===v.id});if(f==='all')return true;if(f==='pending')return v.status!=='listed';if(f==='listed')return v.status==='listed';if(f==='nofeed')return !vf.some(function(x){return x.url||x.external_id});if(f==='stale')return vf.length&&vf.every(function(x){return x.activity==='stale'||x.activity==='error'||x.activity==='empty'});return true}
function feedLine(f){var a=f.activity||(f.url||f.external_id?'unchecked':'no feed address');return '<span class="tag" style="background:'+({active:'#d8f0dc',stale:'#fbe3c8',error:'#f6d0d0',empty:'#f6d0d0'}[a]||'#e6e9ee')+'">'+esc(f.section||f.kind)+': '+esc(a)+(f.last_item_at?' · last '+esc(f.last_item_at.slice(0,10)):'')+'</span> '}
function voices(){return Promise.all([api('voices'),api('feeds')]).then(function(a){var r=a[0],fs=a[1].feeds;var pre=prefill;prefill=null;$('#pane').innerHTML='<h2>'+(pre?'New voice from submission':'Add a voice')+'</h2>'+voiceForm(pre)+'<h2>All voices ('+r.voices.length+')</h2><div class="card">'+[['all','All'],['pending','Pending'],['listed','Listed'],['stale','Stale or broken'],['nofeed','No feed yet']].map(function(x){return '<button data-vf="'+x[0]+'"'+(vfilter===x[0]?' style="font-weight:800;text-decoration:underline"':'')+'>'+x[1]+' ('+r.voices.filter(function(v){return vmatch(v,x[0],fs)}).length+')</button> '}).join('')+'<button id="chk" style="float:right">Check activity</button></div>'+r.voices.filter(function(v){return vmatch(v,vfilter,fs)}).map(function(v){var vf=fs.filter(function(f){return f.voice_id===v.id});return '<div class="card"><b>'+esc(v.name)+'</b> <span class="tag">'+esc(v.status)+'</span> <span class="sm">'+esc(v.id)+(v.position_tag?' · '+esc(v.position_tag):'')+'</span><pre class="sm">'+esc(v.short_bio)+'</pre><div class="sm">'+vf.map(feedLine).join('')+(v.website?'<a href="'+esc(v.website)+'" target="_blank" rel="noopener">site</a>':'')+'</div>'+(v.status!=='listed'?'<button data-list="'+esc(v.id)+'">List</button> ':'')+'<button data-ed="'+esc(v.id)+'">Edit</button> <button class="d" data-vdel="'+esc(v.id)+'">Delete</button></div>'}).join('');
$('#vf').onsubmit=function(e){e.preventDefault();var ed=$('#vf').dataset.id;api('voice',{id:ed||undefined,name:$('#vn').value,status:$('#vs').value,short_bio:$('#vb').value,website:$('#vw').value,topics:$('#vt').value.split(',').map(function(x){return x.trim()}).filter(Boolean),position_tag:$('#vp').value,consent:{excerpt_ok:true,full_text_ok:$('#vf2').checked,date:new Date().toISOString().slice(0,10),note:$('#vc').value}}).then(function(){say('Saved.',true);load()}).catch(function(e){say(e.message)})};
if($('#chk'))$('#chk').onclick=function(){var tot=0;say('Checking feeds for recent posts...',true);(function step(){api('check',{}).then(function(c){tot+=c.checked;if(c.remaining>0){say('Checked '+tot+', '+c.remaining+' to go...',true);step()}else{say('Done. '+JSON.stringify(c.counts),true);load()}}).catch(function(e){say(e.message)})})()};
$('#pane').onclick=function(e){var ed=e.target.dataset.ed,dl=e.target.dataset.vdel;if(e.target.dataset.vf){vfilter=e.target.dataset.vf;return load()}if(e.target.dataset.list){var lv=r.voices.find(function(x){return x.id===e.target.dataset.list});return api('voice',{id:lv.id,name:lv.name,status:'listed',short_bio:lv.short_bio,website:lv.website,topics:lv.topics,position_tag:lv.position_tag,consent:lv.consent}).then(function(){say('Listed '+lv.name+'.',true);load()}).catch(function(x){say(x.message)})}if(ed){var v=r.voices.find(function(x){return x.id===ed});$('#vf').outerHTML=voiceForm(v);$('#vf').dataset.id=v.id;$('#vf').onsubmit=null;var f=$('#vf');f.onsubmit=function(e2){e2.preventDefault();api('voice',{id:v.id,name:$('#vn').value,status:$('#vs').value,short_bio:$('#vb').value,website:$('#vw').value,topics:$('#vt').value.split(',').map(function(x){return x.trim()}).filter(Boolean),position_tag:$('#vp').value,consent:{excerpt_ok:true,full_text_ok:$('#vf2').checked,date:new Date().toISOString().slice(0,10),note:$('#vc').value}}).then(function(){say('Saved.',true);load()}).catch(function(x){say(x.message)})};f.scrollIntoView()}
if(dl){if(e.target.dataset.sure==='1'){api('voice/delete',{id:dl}).then(load)}else{e.target.dataset.sure='1';e.target.textContent='Click again to delete this voice, its feeds and items'}}}})}
function feeds(){return Promise.all([api('voices'),api('feeds')]).then(function(a){var vs=a[0].voices,fs=a[1].feeds;$('#pane').innerHTML='<h2>Add a feed</h2><form id="ff" class="card"><div class="row"><div><label for="fv">Voice</label><select id="fv">'+vs.map(function(v){return '<option value="'+esc(v.id)+'">'+esc(v.name)+'</option>'}).join('')+'</select></div><div><label for="fk">Kind</label><select id="fk"><option>blog</option><option>newsletter</option><option>podcast</option><option>youtube</option><option>bluesky</option><option>threads</option><option>telegram</option></select></div></div><div class="row"><div><label for="fu">Feed URL (RSS or Atom)</label><input id="fu" placeholder="https://"></div><div><label for="fe">YouTube channel id (if kind is youtube and no URL)</label><input id="fe" placeholder="UC..."></div></div><p><button class="p" type="submit">Add feed</button></p></form><h2>Feeds ('+fs.length+')</h2>'+fs.map(function(f){var v=vs.find(function(x){return x.id===f.voice_id});return '<div class="card"><b>'+esc(v?v.name:f.voice_id)+'</b> <span class="tag">'+esc(f.kind)+'</span><span class="tag">'+esc(f.format)+'</span> <span class="sm">'+esc(f.url||f.external_id)+'<br>Last checked: '+esc(f.last_checked||'never')+' · Last item: '+esc(f.last_item_at||'none')+' · Errors: '+(f.error_count||0)+'</span> <button class="d" data-fdel="'+esc(f.id)+'">Remove</button></div>'}).join('');
$('#ff').onsubmit=function(e){e.preventDefault();api('feed',{voice_id:$('#fv').value,kind:$('#fk').value,url:$('#fu').value.trim(),external_id:$('#fe').value.trim()}).then(function(){say('Feed added. Run ingestion to fetch items.',true);load()}).catch(function(x){say(x.message)})};
$('#pane').onclick=function(e){if(e.target.dataset.fdel)api('feed/delete',{id:e.target.dataset.fdel}).then(load)}})}
function subscribers(){return api('subscribers').then(function(r){var l=r.subscribers.slice().reverse();$('#pane').innerHTML='<p class="sm">'+l.length+' subscribers. Copy the list:</p><textarea rows="10" style="width:100%" readonly>'+esc(l.map(function(s){return s.email}).join('\n'))+'</textarea>'})}
var KINDS={act:['petition','event','donate','campus','volunteer'],monitor:['factcheck','correction','tracker']},epre=null;
function entries(){return api('entries').then(function(r){var p=epre||{};epre=null;var opts=function(l,v){return l.map(function(k){return '<option'+(k===v?' selected':'')+'>'+k+'</option>'}).join('')};
$('#pane').innerHTML='<h2>Add an entry for Act or Monitor</h2><form id="ef" class="card"><div class="row"><div><label>Tab</label><select id="et"><option'+(p.type==='monitor'?'':' selected')+'>act</option><option'+(p.type==='monitor'?' selected':'')+'>monitor</option></select></div><div><label>Kind</label><select id="ek">'+opts(KINDS[p.type||'act'],p.kind)+'</select></div></div><label>Title</label><input id="ei" value="'+esc(p.title||'')+'"><label>Link (https). For Monitor this is the source.</label><input id="eu" value="'+esc(p.url||'')+'"><label>Organization or source name</label><input id="eo" value="'+esc(p.org||'')+'"><label>Summary (300 characters)</label><textarea id="es" rows="3">'+esc(p.summary||'')+'</textarea><div class="row"><div><label>Date YYYY-MM-DD (event date, deadline, or source date)</label><input id="ed" value="'+esc(p.date||'')+'"></div><div><label>Location</label><input id="el" value="'+esc(p.location||'')+'"></div></div><label>Topics, comma separated</label><input id="ep" value="'+esc((p.topics||[]).join(', '))+'"><p class="sm">Monitor entries must concern public organizations, outlets, statements or campaigns. Never private individuals.</p><button class="p" type="submit">Publish entry</button></form><h2>Entries ('+r.entries.length+')</h2>'+r.entries.map(function(e){return '<div class="card"><b>'+esc(e.title)+'</b> <span class="sm">'+esc(e.type)+' / '+esc(e.kind)+' / '+esc(e.date||'no date')+'</span><p class="sm">'+esc(e.org)+' '+esc(e.url)+'</p><button class="d" data-edel="'+esc(e.id)+'">Delete</button></div>'}).join('');
$('#et').onchange=function(){$('#ek').innerHTML=opts(KINDS[this.value])};
$('#ef').onsubmit=function(ev){ev.preventDefault();api('entry',{type:$('#et').value,kind:$('#ek').value,title:$('#ei').value,url:$('#eu').value.trim(),org:$('#eo').value,summary:$('#es').value,date:$('#ed').value.trim(),location:$('#el').value,topics:$('#ep').value}).then(function(){say('Entry published.',true);load()}).catch(function(e){say(e.message)})};
$('#pane').onclick=function(ev){var d=ev.target.dataset.edel;if(d)api('entry/delete',{id:d}).then(load)}})}
function proposals(){return api('proposals').then(function(r){var l=r.proposals.slice().reverse();$('#pane').innerHTML=l.length?l.map(function(s){return '<div class="card"><b>'+esc(s.title)+'</b> <span class="sm">'+esc(s.type)+' / '+esc(s.kind)+' / '+esc(s.date||'')+' / from '+esc(s.email)+'</span><pre>'+esc(s.summary)+'</pre><div class="sm">'+esc(s.url)+'</div><p><button data-puse="'+esc(s.id)+'">Review and publish</button> <button class="d" data-pdel="'+esc(s.id)+'">Delete</button></p></div>'}).join(''):'<p class="sm">No proposals yet.</p>';$('#pane').onclick=function(ev){var u=ev.target.dataset.puse,d=ev.target.dataset.pdel;if(u){epre=l.find(function(x){return x.id===u});tab='entries';document.querySelectorAll('#nav [data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t==='entries')});load()}if(d)api('proposal/delete',{id:d}).then(load)}})}
function messages(){return api('messages').then(function(r){var l=r.messages.slice().reverse();$('#pane').innerHTML=l.length?l.map(function(m){return '<div class="card"><b>'+esc(m.topic)+'</b> <span class="sm">'+esc(m.name)+' / '+esc(m.email)+' / '+esc(m.at.slice(0,10))+'</span><pre>'+esc(m.message)+'</pre><p><a href="mailto:'+esc(m.email)+'">Reply</a> <button class="d" data-mdel="'+esc(m.id)+'">Delete</button></p></div>'}).join(''):'<p class="sm">No messages yet.</p>';$('#pane').onclick=function(e){var d=e.target.dataset.mdel;if(d)api('message/delete',{id:d}).then(load)}})}
function taxonomy(){return api('taxonomy').then(function(r){$('#pane').innerHTML='<h2>Taxonomy</h2><p class="sm">Categories, subcategories and tags. '+(r.is_default?'Showing the built-in default.':'Showing your saved version.')+' Each category has a slug, name, description, keywords (kw) and subs. Items are matched on keywords in title and excerpt, and on each voice\'s topics. Slugs must be unique, lowercase letters, numbers and hyphens.</p><textarea id="tj" rows="24" style="width:100%;font-family:monospace;font-size:12px">'+esc(JSON.stringify(r.taxonomy,null,1))+'</textarea><p><button class="p" id="tsave">Save taxonomy</button> <button class="d" id="treset">Reset to default</button></p>';$('#tsave').onclick=function(){var t;try{t=JSON.parse($('#tj').value)}catch(e){say('That is not valid JSON: '+e.message);return}api('taxonomy',{taxonomy:t}).then(function(){say('Saved. Pages update within five minutes.',true)}).catch(function(e){say(e.message)})};$('#treset').onclick=function(){if(confirm('Reset the taxonomy to the built-in default?'))api('taxonomy',{reset:true}).then(function(){say('Reset.',true);load()})}})}
function items(){return api('items').then(function(r){$('#pane').innerHTML='<h2>Latest items ('+r.total+')</h2>'+r.items.map(function(i){return '<div class="card"><span class="tag">'+esc(i.format)+'</span><b>'+esc(i.title)+'</b> '+(i.hidden?'<span class="tag">hidden</span>':'')+(i.featured?'<span class="tag">featured</span>':'')+'<div class="sm">'+esc(i.published_at.slice(0,10))+' · '+esc(i.voice_id)+'</div><button data-h="'+esc(i.id)+'" data-v="'+(!i.hidden)+'">'+(i.hidden?'Unhide':'Hide')+'</button> <button data-fe="'+esc(i.id)+'" data-v="'+(!i.featured)+'">'+(i.featured?'Unfeature':'Feature')+'</button></div>'}).join('');
$('#pane').onclick=function(e){var d=e.target.dataset;if(d.h)api('item',{id:d.h,hidden:d.v==='true'}).then(load);if(d.fe)api('item',{id:d.fe,featured:d.v==='true'}).then(load)}})}
if(key)api('voices').then(function(){show();load()}).catch(function(){key='';show()});else show();
})();
</script></div></body></html>
